; BSN — Supervisor configuration for the queue worker, Reverb WebSocket server,
; and Laravel scheduler. Copy to /etc/supervisor/conf.d/bsn.conf on the
; production host, then:
;   sudo supervisorctl reread
;   sudo supervisorctl update

[program:bsn-queue]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/bsn/api/artisan queue:work --sleep=3 --tries=3 --timeout=120 --backoff=10
autostart=true
autorestart=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/bsn-queue.log
stopwaitsecs=3600

[program:bsn-reverb]
command=php /var/www/bsn/api/artisan reverb:start --host=0.0.0.0 --port=8080
autostart=true
autorestart=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/bsn-reverb.log
stopwaitsecs=10

; Run the Laravel scheduler every minute. Equivalent to a cron line but keeps
; everything under supervisor so a host that lacks cron still gets it.
[program:bsn-scheduler]
command=/bin/sh -c "while true; do php /var/www/bsn/api/artisan schedule:run --no-interaction; sleep 60; done"
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/bsn-scheduler.log
