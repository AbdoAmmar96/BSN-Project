server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — every unknown path goes to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed bundle files aggressively
    location ~* \.(js|css|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Never cache the HTML shell or service worker
    location = /index.html { add_header Cache-Control "no-cache, must-revalidate"; }
    location = /sw.js      { add_header Cache-Control "no-cache, must-revalidate"; }
    location = /manifest.json { add_header Cache-Control "no-cache, must-revalidate"; }

    # Basic security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
